spring.application.name=Api-gateway


server.port=8080

# OAuth2 Resource Server - JWT
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER_URI:https://dev-7fvo8ditenc02enw.us.auth0.com/}

# Spring Cloud Gateway Routes

# Personal Audio Catalog
spring.cloud.gateway.server.webmvc.routes[0].id=catalog-personal-audio
spring.cloud.gateway.server.webmvc.routes[0].uri=${PERSONAL_AUDIO_URL:http://earphone-service:4000}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/iem/**,/api/hp/**,/api/drivertype/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

# Players
spring.cloud.gateway.server.webmvc.routes[1].id=catalog-players
spring.cloud.gateway.server.webmvc.routes[1].uri=${PLAYER_URL:http://player-service:4002}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/player/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1

# Users
spring.cloud.gateway.server.webmvc.routes[2].id=users
spring.cloud.gateway.server.webmvc.routes[2].uri=${USER_URL:http://localhost:4003}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/users/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=StripPrefix=1

# Market
spring.cloud.gateway.server.webmvc.routes[3].id=market
spring.cloud.gateway.server.webmvc.routes[3].uri=${MARKET_URL:http://localhost:4004}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/listings/**,/api/trades/**,/api/ratings/**
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=StripPrefix=1

# Auth0
auth0.audience=${AUTH0_AUDIENCE:https://audiodb-api}

# CORS
audiodb.cors.allowed-origins=http://localhost:3000,http://localhost:5173

